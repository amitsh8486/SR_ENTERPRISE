<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wooden table, chair and stool (illustration)">
<defs>
<filter id="v" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="640" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.1 0.004" numOctaves="3" seed="9" result="a"/>
<feTurbulence type="fractalNoise" baseFrequency="0.55 0.02" numOctaves="2" seed="14" result="b"/>
<feComposite in="a" in2="b" operator="arithmetic" k1="0" k2=".7" k3=".3" k4="0" result="n"/>
<feColorMatrix in="n" type="matrix" values="0.805 0 0 0 0.111  0.683 0 0 0 0.003  0.52 0 0 0 -0.066  0 0 0 0 1" result="c"/>
<feComposite in="c" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="h" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="640" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.004 0.1" numOctaves="3" seed="17" result="a"/>
<feTurbulence type="fractalNoise" baseFrequency="0.02 0.55" numOctaves="2" seed="22" result="b"/>
<feComposite in="a" in2="b" operator="arithmetic" k1="0" k2=".7" k3=".3" k4="0" result="n"/>
<feColorMatrix in="n" type="matrix" values="0.805 0 0 0 0.174  0.755 0 0 0 0.025  0.54 0 0 0 -0.037  0 0 0 0 1" result="c"/>
<feComposite in="c" in2="SourceAlpha" operator="in"/>
</filter>
<radialGradient id="bg" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#3a2618"/><stop offset="1" stop-color="#150d08"/></radialGradient>
</defs>
<rect width="1600" height="640" fill="url(#bg)"/>
<ellipse cx="800" cy="585" rx="660" ry="16" fill="#000" opacity=".45"/>
<!-- table -->
<rect x="270" y="380" width="30" height="200" fill="#000" filter="url(#v)"/><rect x="600" y="380" width="30" height="200" fill="#000" filter="url(#v)"/>
<rect x="300" y="380" width="300" height="34" fill="#000" filter="url(#h)"/>
<rect x="240" y="340" width="420" height="42" fill="#000" filter="url(#h)"/>
<!-- chair -->
<rect x="715" y="150" width="30" height="430" fill="#000" filter="url(#v)"/><rect x="855" y="150" width="30" height="430" fill="#000" filter="url(#v)"/>
<rect x="745" y="150" width="110" height="44" fill="#000" filter="url(#h)"/>
<rect x="745" y="230" width="110" height="24" fill="#000" filter="url(#h)"/>
<rect x="745" y="290" width="110" height="24" fill="#000" filter="url(#h)"/>
<rect x="700" y="380" width="200" height="36" fill="#000" filter="url(#h)"/>
<rect x="745" y="500" width="110" height="22" fill="#000" filter="url(#h)"/>
<!-- stool -->
<rect x="1080" y="420" width="28" height="160" fill="#000" filter="url(#v)"/><rect x="1272" y="420" width="28" height="160" fill="#000" filter="url(#v)"/>
<rect x="1108" y="500" width="164" height="20" fill="#000" filter="url(#h)"/>
<rect x="1050" y="386" width="280" height="36" fill="#000" filter="url(#h)"/>
<g fill="none" stroke="#c9a464" stroke-opacity=".75" stroke-width="2" stroke-linejoin="round">
<rect x="240" y="340" width="420" height="42"/><rect x="300" y="380" width="300" height="34"/><rect x="270" y="380" width="30" height="200"/><rect x="600" y="380" width="30" height="200"/>
<rect x="715" y="150" width="30" height="430"/><rect x="855" y="150" width="30" height="430"/>
<rect x="745" y="150" width="110" height="44"/><rect x="745" y="230" width="110" height="24"/><rect x="745" y="290" width="110" height="24"/>
<rect x="700" y="380" width="200" height="36"/><rect x="745" y="500" width="110" height="22"/>
<rect x="1050" y="386" width="280" height="36"/><rect x="1080" y="420" width="28" height="160"/><rect x="1272" y="420" width="28" height="160"/><rect x="1108" y="500" width="164" height="20"/>
</g>
</svg>
